ir_version: "1"
sources:
  src: {kind: value, dtype: cloud, formats: [native], schema: {fields: [xyz]}}
  tgt: {kind: value, dtype: cloud, formats: [native], schema: {fields: [xyz]}}
sinks:
  T: {kind: value, dtype: rigid_transform, formats: [native]}
  inliers: {kind: value, dtype: correspondence_set, formats: [native]}
params:
  leaf:
    - {node: vox_src, param: leaf}
    - {node: vox_tgt, param: leaf}
  radius_n:
    - {node: nml_src, param: radius_n}
    - {node: nml_tgt, param: radius_n}
  radius_f:
    - {node: fpfh_src, param: radius_f}
    - {node: fpfh_tgt, param: radius_f}
  k:
    - {node: match, param: k}
  ratio:
    - {node: match, param: ratio}
  n_iter:
    - {node: pose, param: n_iter}
  thresh:
    - {node: pose, param: thresh}
  seed:
    - {node: pose, param: seed}
nodes:
  - id: src
    kind: SOURCE
    outputs: {out: {kind: value, dtype: cloud, formats: [native], schema: {fields: [xyz]}}}
  - id: tgt
    kind: SOURCE
    outputs: {out: {kind: value, dtype: cloud, formats: [native], schema: {fields: [xyz]}}}
  - id: vox_src
    op: cloud.voxel
    params: {leaf: 0.05}
    inputs: {in: {kind: value, dtype: cloud, formats: [native], schema: {fields: [xyz]}}}
    outputs: {out: {kind: value, dtype: cloud, formats: [native], schema: {fields: [xyz]}}}
  - id: vox_tgt
    op: cloud.voxel
    params: {leaf: 0.05}
    inputs: {in: {kind: value, dtype: cloud, formats: [native], schema: {fields: [xyz]}}}
    outputs: {out: {kind: value, dtype: cloud, formats: [native], schema: {fields: [xyz]}}}
  - id: nml_src
    op: cloud.normal_est
    params: {k: 16, radius_n: 0.0}
    inputs: {in: {kind: value, dtype: cloud, formats: [native], schema: {fields: [xyz]}}}
    outputs: {out: {kind: value, dtype: cloud, formats: [native], schema: {fields: [xyz, normal]}}}
  - id: nml_tgt
    op: cloud.normal_est
    params: {k: 16, radius_n: 0.0}
    inputs: {in: {kind: value, dtype: cloud, formats: [native], schema: {fields: [xyz]}}}
    outputs: {out: {kind: value, dtype: cloud, formats: [native], schema: {fields: [xyz, normal]}}}
  - id: fpfh_src
    op: cloud.fpfh
    params: {radius_f: 0.15}
    inputs: {in: {kind: value, dtype: cloud, formats: [native], schema: {require: [xyz, normal]}}}
    outputs: {out: {kind: value, dtype: cloud, formats: [native], schema: {fields: [xyz, normal, feat], feat: 33}}}
  - id: fpfh_tgt
    op: cloud.fpfh
    params: {radius_f: 0.15}
    inputs: {in: {kind: value, dtype: cloud, formats: [native], schema: {require: [xyz, normal]}}}
    outputs: {out: {kind: value, dtype: cloud, formats: [native], schema: {fields: [xyz, normal, feat], feat: 33}}}
  - id: match
    op: cloud.match
    params: {k: 1, ratio: 0.95}
    inputs:
      src: {kind: value, dtype: cloud, formats: [native], schema: {feat: 33}}
      tgt: {kind: value, dtype: cloud, formats: [native], schema: {feat: 33}}
    outputs: {corr: {kind: value, dtype: correspondence_set, formats: [native]}}
  - id: pose
    op: cloud.ransac
    params: {n_iter: 256, thresh: 0.05, seed: 42}
    inputs:
      src: {kind: value, dtype: cloud, formats: [native], schema: {fields: [xyz]}}
      tgt: {kind: value, dtype: cloud, formats: [native], schema: {fields: [xyz]}}
      corr: {kind: value, dtype: correspondence_set, formats: [native]}
    outputs:
      T: {kind: value, dtype: rigid_transform, formats: [native]}
      inliers: {kind: value, dtype: correspondence_set, formats: [native]}
  - id: T
    kind: SINK
    inputs: {in: {kind: value, dtype: rigid_transform, formats: [native]}}
    outputs: {out: {kind: value, dtype: rigid_transform, formats: [native]}}
  - id: inliers
    kind: SINK
    inputs: {in: {kind: value, dtype: correspondence_set, formats: [native]}}
    outputs: {out: {kind: value, dtype: correspondence_set, formats: [native]}}
edges:
  - [src.out, vox_src.in]
  - [tgt.out, vox_tgt.in]
  - [vox_src.out, nml_src.in]
  - [vox_tgt.out, nml_tgt.in]
  - [nml_src.out, fpfh_src.in]
  - [nml_tgt.out, fpfh_tgt.in]
  - [fpfh_src.out, match.src]
  - [fpfh_tgt.out, match.tgt]
  - [vox_src.out, pose.src]
  - [vox_tgt.out, pose.tgt]
  - [match.corr, pose.corr]
  - [pose.T, T.in]
  - [pose.inliers, inliers.in]
